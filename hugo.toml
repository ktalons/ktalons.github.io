baseURL = "https://ktalons.github.io/"
title = "Kyle Versluis"
theme = "hugo-coder"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true

[pagination]
pagerSize = 10

[permalinks]
posts = "/blog/:slug/"
projects = "/projects/:slug/"

[markup]
[markup.highlight]
  noClasses = false
  style = "catppuccin-mocha"
  lineNos = false
  codeFences = true
  guessSyntax = true
  tabWidth = 4
[markup.goldmark.renderer]
  unsafe = true

[params]
  author = "Kyle Versluis"
  description = "Cybersecurity Engineer — OT SOC + Detection Engineering. BAS Cyber Operations graduate (Engineering Emphasis), University of Arizona. Based in Tucson, AZ. Open to relocation to Phoenix and federal positions."
  keywords = "cybersecurity, SOC, detection engineering, OT security, ICS, MITRE ATT&CK, threat hunting, Tucson, Phoenix, DHS, Kyle Versluis"
  info = [
    "Cybersecurity Engineer",
    "OT SOC + Detection Engineering",
    "University of Arizona — BAS Cyber Operations '26"
  ]
  avatarURL = "images/avatar.svg"
  dateFormat = "January 2, 2006"
  since = 2026

  # Color scheme: dark default (Catppuccin Mocha is a dark palette)
  colorScheme = "dark"
  hideColorSchemeToggle = false

  # Custom CSS injection
  customCSS = ["css/custom.css"]
  customSCSS = []
  customJS = []

  # Footer
  hideFooter = false
  hideCredits = false
  hideCopyright = false

  # Misc
  maxSeeAlsoItems = 5
  rtl = false

# Social icons (rendered below name + info on home)
[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/ktalons/"

[[params.social]]
  name = "LinkedIn"
  icon = "fa-brands fa-linkedin fa-2x"
  weight = 2
  url = "https://www.linkedin.com/in/ta1ons/"

[[params.social]]
  name = "Email"
  icon = "fa-solid fa-envelope fa-2x"
  weight = 3
  url = "mailto:ktalonsec@gmail.com"

[[params.social]]
  name = "RSS"
  icon = "fa-solid fa-rss fa-2x"
  weight = 4
  url = "/blog/index.xml"
  rel = "alternate"
  type = "application/rss+xml"

