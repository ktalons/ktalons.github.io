baseURL = "https://ktalons.github.io/"
title = "Kyle Versluis"
theme = "hugo-coder"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true
enableRobotsTXT = true

[pagination]
pagerSize = 10

[permalinks]
posts = "/blog/:slug/"
projects = "/projects/:slug/"

[markup]
[markup.highlight]
  noClasses = false
  style = "catppuccin-mocha"
  lineNos = false
  codeFences = true
  guessSyntax = true
  tabWidth = 4
[markup.goldmark.renderer]
  # Disabled — raw HTML in markdown is rendered via shortcodes (see layouts/shortcodes/).
  # If you ever need to embed raw HTML, write a shortcode instead of flipping this.
  unsafe = false

[params]
  author = "Kyle Versluis"
  description = "Cybersecurity Analyst and Engineer. BAS Cyber Operations graduate (Engineering Emphasis), University of Arizona. Based in Tucson, AZ. Open to SOC, detection engineering, and federal security engineering roles."
  keywords = "cybersecurity analyst, security engineer, SOC, detection engineering, threat hunting, MITRE ATT&CK, Tucson, DHS, Kyle Versluis"
  info = [
    "Cybersecurity Analyst and Engineer",
    "BAS Cyber Operations '26",
    "University of Arizona"
  ]
  avatarURL = "images/avatar.jpeg"
  dateFormat = "January 2, 2006"
  since = 2026

  # Color scheme: dark default (Catppuccin Mocha is a dark palette)
  colorScheme = "dark"
  hideColorSchemeToggle = false

  # Custom CSS injection
  customCSS = ["css/custom.css"]
  customSCSS = []
  customJS = ["js/hero-fade.js", "js/hackme.js", "js/hackme-menu.js", "js/phishing-game.js", "js/malicious-url-game.js"]

  # Footer
  hideFooter = false
  hideCredits = false
  hideCopyright = false

  # Misc
  maxSeeAlsoItems = 5
  rtl = false

# Social icons (rendered below name + info on home)
[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/ktalons/"

[[params.social]]
  name = "LinkedIn"
  icon = "fa-brands fa-linkedin fa-2x"
  weight = 2
  url = "https://www.linkedin.com/in/ta1ons/"

[[params.social]]
  name = "Email"
  icon = "fa-solid fa-envelope fa-2x"
  weight = 3
  url = "mailto:ktalonsec@gmail.com"

[[params.social]]
  name = "RSS"
  icon = "fa-solid fa-rss fa-2x"
  weight = 4
  url = "/blog/index.xml"
  rel = "alternate"
  type = "application/rss+xml"

# Top navigation
[[menu.main]]
  name = "About"
  weight = 1
  url = "/about/"

[[menu.main]]
  name = "Projects"
  weight = 2
  url = "/projects/"

[[menu.main]]
  name = "Blog"
  weight = 3
  url = "/blog/"

[[menu.main]]
  name = "Contact"
  weight = 4
  url = "/contact/"
